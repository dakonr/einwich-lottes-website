name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  # ============================================================
  # 1. TESTS: Lighthouse CI + Accessibility (Parallel)
  # ============================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      lighthouse-results: ${{ steps.lighthouse.outputs.results }}
      a11y-results: ${{ steps.a11y.outputs.results }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # --- Run Accessibility Tests ---
      - name: Run accessibility tests
        id: a11y
        run: |
          npx playwright test --reporter=json > a11y-results.json
          echo "results<<EOF" >> $GITHUB_OUTPUT
          cat a11y-results.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # --- Run Lighthouse CI ---
      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Extract Lighthouse results
        run: |
          echo "results<<EOF" >> $GITHUB_OUTPUT
          ls -la .lighthouseci/ >> $GITHUB_OUTPUT 2>&1 || true
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Lighthouse results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readdirSync('.lighthouseci');
            const lhrFiles = files.filter(f => f.endsWith('.lhr.json'));

            let comment = '## ⚡ Lighthouse CI Results\n\n';

            for (const file of lhrFiles) {
              const data = JSON.parse(fs.readFileSync(`.lighthouseci/${file}`, 'utf8'));
              const url = data.finalUrl || data.requestedUrl;
              const scores = data.categories || {};
              
              comment += `### ${url}\n\n`;
              comment += '| Category | Score |\n|----------|-------|\n';
              for (const [cat, score] of Object.entries(scores)) {
                if (cat === 'accessibility' || cat === 'performance' || cat === 'seo' || cat === 'best-practices') {
                  comment += `| ${cat} | ${Math.round(score.score * 100)}% |\n`;
                }
              }
              comment += '\n';
              
              // Core Web Vitals
              const audits = data.audits || {};
              const lcp = audits['largest-contentful-paint']?.displayValue || 'N/A';
              const cls = audits['cumulative-layout-shift']?.displayValue || 'N/A';
              const tbt = audits['total-blocking-time']?.displayValue || 'N/A';
              
              comment += `**Core Web Vitals:** LCP: ${lcp}, CLS: ${cls}, TBT: ${tbt}\n\n`;
              
              // Report URL
              const storagePath = fs.readFileSync('.lighthouseci/LIGHTHOUSE_CI_STORAGE_PATH', 'utf8').trim();
              if (storagePath) {
                comment += `[📊 Full Report](${storagePath}/${file.replace('.lhr.json', '')}.html)\n\n`;
              }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Lighthouse CI Results'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: comment
              });
            }

